name: D1 · type=s3
# Study D1: the workflow printed on the post, plus a second build on a fresh builder. The two images carry the same
# /stamp only if the second build took the RUN layer from the cache. See studies/D1-build-push-reference/METHOD.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      S3_ACCESS_KEY_ID: d1access
      S3_SECRET_ACCESS_KEY: d1secret-d1secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start an S3-compatible server (Adobe S3Mock) with a bucket
        run: |
          docker run -d --name s3mock --network host adobe/s3mock
          until curl -fs http://127.0.0.1:9090/ >/dev/null; do sleep 1; done
          curl -fsS -X PUT http://127.0.0.1:9090/buildcache
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: studies/D1-build-push-reference
          push: true
          tags: ghcr.io/${{ github.repository }}:d1-s3
          cache-from: type=s3,region=us-east-1,bucket=buildcache,name=app,endpoint_url=http://127.0.0.1:9090,use_path_style=true,access_key_id=${{ env.S3_ACCESS_KEY_ID }},secret_access_key=${{ env.S3_SECRET_ACCESS_KEY }}
          cache-to: type=s3,region=us-east-1,bucket=buildcache,name=app,endpoint_url=http://127.0.0.1:9090,use_path_style=true,access_key_id=${{ env.S3_ACCESS_KEY_ID }},secret_access_key=${{ env.S3_SECRET_ACCESS_KEY }},mode=max
      - name: Read /stamp from the image just pushed
        id: first
        run: echo "stamp=$(docker run --rm ghcr.io/${{ github.repository }}:d1-s3)" >> "$GITHUB_OUTPUT"
      - name: Remove the builder and everything it held, as a new runner would
        run: |
          docker buildx rm --force --all-inactive || true
          for b in $(docker buildx ls --format '{{.Name}}' | grep -v -x -e default -e desktop-linux || true); do docker buildx rm --force "$b" || true; done
          docker system prune --all --force >/dev/null
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: studies/D1-build-push-reference
          push: true
          tags: ghcr.io/${{ github.repository }}:d1-s3
          cache-from: type=s3,region=us-east-1,bucket=buildcache,name=app,endpoint_url=http://127.0.0.1:9090,use_path_style=true,access_key_id=${{ env.S3_ACCESS_KEY_ID }},secret_access_key=${{ env.S3_SECRET_ACCESS_KEY }}
          cache-to: type=s3,region=us-east-1,bucket=buildcache,name=app,endpoint_url=http://127.0.0.1:9090,use_path_style=true,access_key_id=${{ env.S3_ACCESS_KEY_ID }},secret_access_key=${{ env.S3_SECRET_ACCESS_KEY }},mode=max
      - name: Read /stamp from the image just pushed
        id: second
        run: echo "stamp=$(docker run --rm ghcr.io/${{ github.repository }}:d1-s3)" >> "$GITHUB_OUTPUT"
      - name: The second build must have read the first one's cache
        run: |
          echo "first : ${{ steps.first.outputs.stamp }}"
          echo "second: ${{ steps.second.outputs.stamp }}"
          [ -n "${{ steps.first.outputs.stamp }}" ] && [ "${{ steps.first.outputs.stamp }}" = "${{ steps.second.outputs.stamp }}" ]

name: F1-13 does include match a number against a string
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
        include:
          # "22" is a string; the axis holds the number 22.
          - node: "22"
            npm: "10"
    steps:
      - run: echo '${{ toJSON(matrix) }}'
  case_and_bool:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        os: [Ubuntu-24.04]
        flag: [true]
        include:
          # Same label in lower case, and the string "true" for the boolean true.
          - os: ubuntu-24.04
            note: case-matched
          - flag: "true"
            note2: bool-matched
    steps:
      - run: echo '${{ toJSON(matrix) }}'

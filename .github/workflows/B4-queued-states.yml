# B4 (RUN-4125): the three ways a run waits, one at a time, so the status word each one shows can be read off the API.
# `kind` picks which job runs; the other two are skipped, so a run has exactly one wait in it.
#   no-runner: runs-on names a label no runner has.        Expected: the job stays "queued".
#   gated:     the job needs an environment's reviewer.     Expected: the run is "waiting".
#   limited:   a second run of the same job-level group.    Expected: the run is "pending".
# For `limited`, dispatch it twice within a few seconds with the same label; studies/B4-queued-states/observe.py reads the statuses back and cancels the runs.
name: B4 queued states

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Which dispatch this is (recorded in the run name, and part of the concurrency group)"
        required: false
        default: "b4"
      kind:
        description: "Which wait to produce: no-runner, gated or limited"
        required: true
        default: "no-runner"

run-name: B4 queued states ${{ inputs.kind }} ${{ inputs.label }}

permissions:
  contents: read

jobs:
  no-runner:
    if: inputs.kind == 'no-runner'
    runs-on: b4-no-such-runner
    timeout-minutes: 5
    steps:
      - run: echo "never runs"
  gated:
    if: inputs.kind == 'gated'
    runs-on: ubuntu-24.04
    environment: b4-gated
    timeout-minutes: 5
    steps:
      - run: echo "never runs unless a reviewer approves"
  limited:
    if: inputs.kind == 'limited'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: b4-limited-${{ inputs.label }}
    steps:
      - run: sleep 90

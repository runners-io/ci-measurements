name: F1-08 outputs from matrix jobs
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: [1, 2, 3]
    # The output names are fixed. Each leg writes the one named for it, and GitHub combines them.
    outputs:
      output_1: ${{ steps.gen.outputs.output_1 }}
      output_2: ${{ steps.gen.outputs.output_2 }}
      output_3: ${{ steps.gen.outputs.output_3 }}
      shared: ${{ steps.gen.outputs.shared }}
    steps:
      - id: gen
        run: |
          echo "output_${{ matrix.version }}=built-${{ matrix.version }}" >> "$GITHUB_OUTPUT"
          echo "shared=leg-${{ matrix.version }}" >> "$GITHUB_OUTPUT"
  report:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - run: echo '${{ toJSON(needs.build.outputs) }}'

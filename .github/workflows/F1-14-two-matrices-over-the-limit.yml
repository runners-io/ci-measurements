name: F1-14 two matrices of 130 legs
on: workflow_dispatch
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.p.outputs.legs }}
    steps:
      - id: p
        run: echo "legs=$(python3 -c 'import json;print(json.dumps(list(range(130))))')" >> "$GITHUB_OUTPUT"
  first:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - run: echo "first ${{ matrix.n }}"
  second:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - run: echo "second ${{ matrix.n }}"

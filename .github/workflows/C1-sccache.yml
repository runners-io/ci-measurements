# C1: sccache on GitHub Actions, measured. Every arm builds the same Rust workspace (helix 25.07.1, pinned) on ubuntu-24.04,
# once cold and once warm, on a fresh runner each time, in two build profiles. See studies/C1-sccache/METHOD.md.
name: C1 sccache

on:
  workflow_dispatch:
    inputs:
      reps:
        description: "repetitions, as a JSON list"
        default: "[1,2,3,4,5]"
      profiles:
        description: "build profiles, as a JSON list of dev and release"
        default: '["dev","release"]'

permissions:
  contents: read

jobs:
  pair:
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: ${{ fromJSON(inputs.profiles) }}
        rep: ${{ fromJSON(inputs.reps) }}
    uses: ./.github/workflows/C1-pair.yml
    with:
      profile: ${{ matrix.profile }}
      rep: ${{ matrix.rep }}

  cleanup:
    needs: pair
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete the sccache GHA backend's entries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key "sccache/" --limit 1000 --json id -q '.[].id' | while read -r id; do gh cache delete "$id" || true; done

name: D2 · size of the gha cache
# Study D2, the one figure the repetitions cannot give: how many bytes type=gha stores for each Dockerfile, in min and max
# mode. The repository's Actions cache is shared with other studies, so this runs ALONE (one job at a time, and not while
# a D2 repetition runs), reads only BuildKit's own keys (index-* and buildkit-blob-*), and deletes them again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size:
    name: ${{ matrix.image }} · ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: [node, go, python]
        mode: [min, max]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Remove BuildKit's cache entries left by anything earlier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 --json id,key \
            --jq '.[] | select(.key | startswith("index-") or startswith("buildkit-blob-")) | .id' > ids.txt
          while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true; done < ids.txt
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: studies/D2-docker-cache-backends/apps/${{ matrix.image }}
          push: false
          cache-to: type=gha,scope=d2size-${{ matrix.image }}-${{ matrix.mode }},mode=${{ matrix.mode }}
      - name: Add up what BuildKit stored, record it, and delete it
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          MODE: ${{ matrix.mode }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 --json id,key,sizeInBytes \
            --jq '[.[] | select(.key | startswith("index-") or startswith("buildkit-blob-"))]' > mine.json
          bytes=$(jq '[.[].sizeInBytes] | add // 0' mine.json)
          entries=$(jq 'length' mine.json)
          row="$(date -u +%Y-%m-%dT%H:%M:%SZ),$GITHUB_RUN_ID,$IMAGE,gha-$MODE,$entries,$bytes,${ImageVersion:-}"
          echo "$row"
          mkdir -p studies/D2-docker-cache-backends/results
          out=studies/D2-docker-cache-backends/results/gha-sizes.csv
          [ -f "$out" ] || echo "date_utc,run_id,image,backend,cache_entries,cache_bytes,runner_image" > "$out"
          echo "$row" >> "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          git commit -m "D2: gha cache size, $IMAGE $MODE"
          for _ in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          jq -r '.[].id' mine.json | while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true; done

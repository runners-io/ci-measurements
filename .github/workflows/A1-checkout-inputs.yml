name: A1 · actions/checkout, every major version, tested

# Runs the inputs a reference page documents against actions/checkout@v4, @v5, @v6 and @v7 (the floating tags, as a
# workflow that says `@v4` gets them), and records what each leaves in the working copy. GitHub-hosted ubuntu-24.04,
# public repository. GENERATED by studies/A1-checkout-reference/scripts/generate.py: edit that, not this file.
# Method: studies/A1-checkout-reference/METHOD.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: actions/checkout@v4
    steps:
      - name: this repository, for the observe script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
      - name: which commit the floating tag is
        run: |
          echo "version,case,action_runtime,git_version,shallow,commits,tags,files,partial_filter,extraheader_in_git_config,includeif_in_git_config,credential_files_in_runner_temp,output_commit_matches_head,output_ref" > observations.csv
          sha=$(git ls-remote https://github.com/actions/checkout "refs/tags/v4" "refs/tags/v4^{}" | tail -1 | cut -f1)
          echo "v4,tag-points-at,$sha,,,,,,,,,,," >> observations.csv
      - name: "default"
        id: c-default
        uses: actions/checkout@v4
        with:
          repository: actions/checkout
          ref: 3d3c42e5aac5ba805825da76410c181273ba90b1
          path: t-default
      - name: "observe default"
        run: harness/studies/A1-checkout-reference/scripts/observe.sh "v4" "default" "t-default" "${{ steps.c-default.outputs.commit }}" "${{ steps.c-default.outputs.ref }}" >> observations.csv
      - name: "depth0"
        id: c-depth0
        uses: actions/checkout@v4
        with:
          repository: actions/checkout
          ref: 3d3c42e5aac5ba805825da76410c181273ba90b1
          path: t-depth0
          fetch-depth: '0'
      - name: "observe depth0"
        run: harness/studies/A1-checkout-reference/scripts/observe.sh "v4" "depth0" "t-depth0" "${{ steps.c-depth0.outputs.commit }}" "${{ steps.c-depth0.outputs.ref }}" >> observations.csv
      - name: "depth2"
        id: c-depth2
        uses: actions/checkout@v4
        with:
          repository: actions/checkout
          ref: 3d3c42e5aac5ba805825da76410c181273ba90b1
          path: t-depth2

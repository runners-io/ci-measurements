name: F1-06b an empty matrix without the guard
on: workflow_dispatch
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - id: dirs
        run: echo 'dirs=[]' >> "$GITHUB_OUTPUT"
  test:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        dir: ${{ fromJSON(needs.plan.outputs.dirs) }}
    steps:
      - run: echo "would test ${{ matrix.dir }}"

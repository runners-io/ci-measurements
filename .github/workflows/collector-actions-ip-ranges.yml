name: collector · actions ip ranges

# Once a day, reads the `actions` ranges from https://api.github.com/meta and
# appends a row to collectors/actions-ip-ranges/ranges.csv, with the full list
# stored as a dated file beside it. Scheduled runs here can be hours late, so
# each row carries the time the read happened.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collectors-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the ranges
        run: collectors/actions-ip-ranges/collect.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collectors/actions-ip-ranges
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "collector: actions ip ranges, $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "push failed after 5 attempts" >&2
          exit 1

name: F1-10 parallel steps
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: sequential, 10 s then 10 s
        run: |
          date -u +%T; sleep 10; sleep 10; date -u +%T
      - name: background a
        id: a
        background: true
        run: |
          sleep 10; echo "a=done" >> "$GITHUB_OUTPUT"
      - name: background b
        id: b
        background: true
        run: |
          sleep 10; echo "b=done" >> "$GITHUB_OUTPUT"
      - name: wait for a and b
        wait: [a, b]
      - name: read their outputs
        run: echo "a=${{ steps.a.outputs.a }} b=${{ steps.b.outputs.b }}"
      - parallel:
          - name: p1
            run: sleep 10
          - name: p2
            run: sleep 10
      - name: after the group
        run: date -u +%T

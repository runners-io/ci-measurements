name: F1-10 parallel steps
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: sequential, 10 s + 10 s
        run: sleep 10; sleep 10
      - name: two background steps, 10 s each
        id: a
        background: true
        run: sleep 10; echo "a=done" >> "$GITHUB_OUTPUT"
      - name: second background step
        id: b
        background: true
        run: sleep 10; echo "b=done" >> "$GITHUB_OUTPUT"
      - name: wait for both
        wait: [a, b]
      - name: parallel group, 10 s each
        parallel:
          - name: p1
            run: sleep 10
          - name: p2
            run: sleep 10
      - name: after the group
        run: echo "a=${{ steps.a.outputs.a }} b=${{ steps.b.outputs.b }}"

name: D1 · two platforms without setup-qemu-action
# Study D1: the workflow printed on the post, then a check on what it pushed. See studies/D1-build-push-reference/METHOD.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: studies/D1-build-push-reference
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:d1-multiplatformbare
      - name: The pushed tag lists both platforms, and the arm64 image runs
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:d1-multiplatformbare | tee inspect.txt
          grep -q 'linux/amd64' inspect.txt && grep -q 'linux/arm64' inspect.txt

          HASH_AFTER="${{ hashFiles('**/composer.lock', '!vendor/**') }}"
          echo "hashFiles before the install: $HASH_BEFORE"; echo "hashFiles after the install:  $HASH_AFTER"
          if [ "$HASH_BEFORE" = "$HASH_AFTER" ]; then echo 'KEY_DRIFT=no' >> "$GITHUB_ENV"; else echo 'KEY_DRIFT=yes' >> "$GITHUB_ENV"; fi
      - name: Measure what is cached
        run: |
          for p in "$HOME/.cache/composer/files"; do [ -e "$p" ] && du -sm "$p"; done | awk '{s+=$1} END{print s+0}' > mb.txt
          for p in "$HOME/.cache/composer/files"; do [ -e "$p" ] && find "$p" -type f; done | wc -l > files.txt
          echo "CACHE_MB=$(cat mb.txt) CACHE_FILES=$(tr -d ' ' < files.txt)"
          echo "CACHE_MB=$(cat mb.txt)" >> "$GITHUB_ENV"; echo "CACHE_FILES=$(tr -d ' ' < files.txt)" >> "$GITHUB_ENV"
          [ "$(cat mb.txt)" -gt 0 ] || { echo 'the cached paths are empty: the recipe points at the wrong directory'; exit 1; }
      - name: Write the row
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP/keydrift.txt" out/keydrift.txt 2>/dev/null || true
          echo 'ecosystem,phase,run_id,date_utc,image,restore_s,restore_hit,matched_key,install_s,save_s,cache_mb,cache_files,key_drift_during_install' > out/row.csv
          echo "composer,edit,${{ github.run_id }},$(date -u +%FT%TZ),${ImageOS}-${ImageVersion},$RESTORE_S,$HIT,$MATCHED,$INSTALL_S,${SAVE_S:-},$CACHE_MB,$CACHE_FILES,$KEY_DRIFT" >> out/row.csv
          cat out/row.csv
      - uses: actions/upload-artifact@v7
        with:
          name: c3f-composer-edit
          path: out/

  cleanup:
    needs: [npm-edit, pnpm-edit, yarn-edit, pip-edit, poetry-edit, gradle-edit, maven-edit, cargo-edit, go-edit, bundler-edit, nuget-edit, composer-edit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete this run's caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key "${PFX}-" --limit 1000 --json id -q '.[].id' | while read -r id; do gh cache delete "$id" || true; done
